<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>محاسبة الشيخ بالمهدي</title>
<link rel="manifest" href="data:application/manifest+json,{}">
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Cairo:wght@400;600;800&display=swap');

:root{
  --bg:#FAF7F0;
  --bg-elevated:#FFFFFF;
  --ink:#1E2A28;
  --ink-soft:#5C6B67;
  --line:#E5DFD1;
  --teal:#0F5C52;
  --teal-deep:#0A4038;
  --gold:#C9971C;
  --gold-soft:#F3E6C2;
  --maroon:#A13D3D;
  --maroon-soft:#F3DEDA;
  --green:#3F8F6F;
  --green-soft:#DCEEE4;
  --card-radius:18px;
  --shadow:0 2px 14px rgba(20,30,28,.08);
}
[data-theme="dark"]{
  --bg:#14181B;
  --bg-elevated:#1D2327;
  --ink:#F3F1EA;
  --ink-soft:#9AA5A2;
  --line:#2B3236;
  --teal:#2E9683;
  --teal-deep:#1F6F61;
  --gold:#E0B23E;
  --gold-soft:#3A331C;
  --maroon:#D97D7D;
  --maroon-soft:#3A2323;
  --green:#6FCBA6;
  --green-soft:#1E332B;
  --shadow:0 2px 18px rgba(0,0,0,.4);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Tajawal',sans-serif;
  overflow-x:hidden;
  transition:background .25s ease, color .25s ease;
}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:86px;}
h1,h2,h3{font-family:'Cairo',sans-serif; margin:0;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}

/* ---------- Splash ---------- */
.splash{
  position:fixed;inset:0;background:linear-gradient(160deg,var(--teal-deep),var(--teal));
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:999; color:#fff; text-align:center; gap:18px;
  animation:fadeOut .6s ease 2.4s forwards;
}
.splash img{
  width:132px;height:132px;border-radius:50%;object-fit:cover;
  border:4px solid var(--gold); box-shadow:0 8px 30px rgba(0,0,0,.35);
  animation:pop .7s cubic-bezier(.34,1.56,.64,1);
}
.splash h1{font-size:22px;font-weight:800;letter-spacing:.3px;}
.splash p{margin:0;font-size:13px;opacity:.85;}
.splash .brandmark{width:46px;height:2px;background:var(--gold);border-radius:2px;}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fadeOut{to{opacity:0;visibility:hidden;pointer-events:none;}}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;background:var(--bg);
  padding:18px 18px 10px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid transparent;
}
.topbar.scrolled{border-color:var(--line);}
.topbar h2{font-size:19px;font-weight:800;}
.topbar .sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.icon-btn{
  width:40px;height:40px;border-radius:12px;border:1px solid var(--line);
  background:var(--bg-elevated);display:flex;align-items:center;justify-content:center;
  cursor:pointer; color:var(--ink);
}
.icon-btn svg{width:19px;height:19px;}

/* ---------- Generic layout ---------- */
.screen{padding:6px 18px 30px;}
.section-title{font-size:14px;font-weight:700;color:var(--ink-soft);margin:22px 0 10px;}
.card{
  background:var(--bg-elevated);border:1px solid var(--line);border-radius:var(--card-radius);
  padding:16px;box-shadow:var(--shadow);
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.stat-card{
  background:var(--bg-elevated);border:1px solid var(--line);border-radius:16px;padding:14px 15px;
  position:relative;overflow:hidden;
}
.stat-card .bar{position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;}
.stat-card .lbl{font-size:12px;color:var(--ink-soft);font-weight:500;}
.stat-card .val{font-size:19px;font-weight:800;margin-top:6px;font-family:'Cairo',sans-serif;}
.stat-card .val small{font-size:12px;font-weight:600;color:var(--ink-soft);}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 18px;border-radius:14px;border:none;font-weight:700;font-size:14.5px;
  cursor:pointer;width:100%;
}
.btn-primary{background:var(--teal);color:#fff;}
.btn-gold{background:var(--gold);color:#2A2205;}
.btn-outline{background:transparent;border:1.5px solid var(--line);color:var(--ink);}
.btn-danger{background:var(--maroon-soft);color:var(--maroon);}
.btn-sm{width:auto;padding:8px 14px;font-size:13px;border-radius:10px;}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;font-weight:600;}
.field input,.field select,.field textarea{
  width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--bg);color:var(--ink);font-size:14.5px;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--teal);border-color:var(--teal);}
.field textarea{resize:vertical;min-height:70px;}
.seg{display:flex;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:3px;gap:3px;}
.seg button{flex:1;padding:9px;border:none;background:transparent;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;}
.seg button.active{background:var(--teal);color:#fff;}

.list-row{
  display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--bg-elevated);
  border:1px solid var(--line);border-radius:14px;margin-bottom:9px;cursor:pointer;
}
.avatar{
  width:42px;height:42px;border-radius:50%;background:var(--teal);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0;
}
.list-row .info{flex:1;min-width:0;}
.list-row .info .name{font-weight:700;font-size:14.5px;}
.list-row .info .meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.list-row .amt{font-weight:800;font-size:14px;font-family:'Cairo',sans-serif;white-space:nowrap;}
.pos{color:var(--green);} .neg{color:var(--maroon);}

.empty{text-align:center;padding:50px 20px;color:var(--ink-soft);}
.empty svg{width:50px;height:50px;opacity:.35;margin-bottom:10px;}
.empty p{margin:4px 0 16px;font-size:13.5px;}

.chip{display:inline-flex;padding:5px 11px;border-radius:20px;font-size:11.5px;font-weight:700;}
.tx-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);}
.tx-row:last-child{border-bottom:none;}
.tx-row .l .t{font-size:13.5px;font-weight:700;}
.tx-row .l .d{font-size:11.5px;color:var(--ink-soft);margin-top:3px;}
.tx-row .r{font-weight:800;font-family:'Cairo',sans-serif;font-size:14px;text-align:left;}

.fab{
  position:fixed;bottom:92px;left:50%;transform:translateX(-50%);max-width:448px;width:calc(100% - 36px);
  z-index:30;
}
.fab .btn{box-shadow:0 8px 24px rgba(15,92,82,.35);}

.tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  background:var(--bg-elevated);border-top:1px solid var(--line);
  display:flex;z-index:50;padding:8px 6px calc(8px + env(safe-area-inset-bottom));
}
.tabbar button{
  flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:6px 2px;color:var(--ink-soft);font-size:10.5px;font-weight:700;cursor:pointer;
}
.tabbar button svg{width:21px;height:21px;}
.tabbar button.active{color:var(--teal);}

.modal-backdrop{
  position:fixed;inset:0;background:rgba(10,15,14,.55);z-index:80;
  display:flex;align-items:flex-end;justify-content:center;
}
.modal{
  background:var(--bg);width:100%;max-width:480px;border-radius:22px 22px 0 0;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;
  animation:slideUp .28s ease;
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:40px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 14px;}
.modal h3{font-size:17px;margin-bottom:16px;}

.toast{
  position:fixed;bottom:110px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;font-size:13.5px;font-weight:600;
  z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:all .25s ease;
}
.toast.show{opacity:1;bottom:120px;}

.alert-banner{
  background:var(--maroon-soft);border:1px solid var(--maroon);border-radius:14px;padding:13px 14px;
  margin-bottom:16px;display:flex;gap:10px;align-items:flex-start;
}
.alert-banner svg{width:18px;height:18px;color:var(--maroon);flex-shrink:0;margin-top:1px;}
.alert-banner .txt{font-size:12.5px;color:var(--maroon);line-height:1.6;}

.color-dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--bg-elevated);box-shadow:0 0 0 1.5px var(--line);cursor:pointer;}
.color-dot.sel{box-shadow:0 0 0 2px var(--ink);}

.auth-wrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 26px;}
.auth-logo{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);margin:0 auto 18px;display:block;}
.auth-wrap h1{text-align:center;font-size:20px;margin-bottom:4px;}
.auth-wrap .sub{text-align:center;color:var(--ink-soft);font-size:13px;margin-bottom:28px;}
.auth-switch{text-align:center;margin-top:16px;font-size:13px;color:var(--ink-soft);}
.auth-switch a{color:var(--teal);font-weight:700;cursor:pointer;text-decoration:none;}

.search-bar{display:flex;gap:8px;margin-bottom:14px;}
.search-bar input{flex:1;}
.filter-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:4px;}
.filter-row::-webkit-scrollbar{display:none;}
.filter-chip{
  flex-shrink:0;padding:8px 14px;border-radius:20px;border:1.5px solid var(--line);
  background:var(--bg-elevated);font-size:12px;font-weight:700;color:var(--ink-soft);cursor:pointer;white-space:nowrap;
}
.filter-chip.active{background:var(--teal);border-color:var(--teal);color:#fff;}

.report-bar-wrap{display:flex;align-items:flex-end;gap:6px;height:110px;margin:18px 0 6px;padding:0 2px;}
.report-bar{flex:1;background:var(--teal);border-radius:6px 6px 2px 2px;min-height:4px;position:relative;}
.report-bar span{position:absolute;bottom:-20px;right:0;left:0;text-align:center;font-size:9.5px;color:var(--ink-soft);}

.hidden{display:none !important;}
::selection{background:var(--gold-soft);}
</style>
</head>

  <h1>محاسبة الشيخ بالمهدي بن سيدي العروسي بن فرج</h1>
  <p>تطبيق المحاسبة الذكي</p>
</div>

<div id="app"></div>
<div id="toast" class="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
/* ========================= محاسبة الشيخ بالمهدي — منطق التطبيق ========================= */

const OWNER_NAME = "الشيخ بالمهدي بن سيدي العروسي بن فرج";

const TX_TYPES = {
  debt_them:      { label:"دين لهم عندي (لي)",   sign:+1, bucket:"owed_to_me" },
  payment_from:   { label:"تسديد مستلم منهم",     sign:-1, bucket:"owed_to_me" },
  debt_me:        { label:"دين علي (لهم)",        sign:+1, bucket:"owed_by_me" },
  payment_to:     { label:"تسديد مدفوع لهم",      sign:-1, bucket:"owed_by_me" },
  expense_business:{ label:"مصروف عمل",           sign:+1, bucket:"expense_business" },
  expense_family: { label:"مصروف عائلي",          sign:+1, bucket:"expense_family" },
  expense_other:  { label:"مصروف آخر",            sign:+1, bucket:"expense_other" },
  income_other:   { label:"دخل / إيراد آخر",       sign:+1, bucket:"income_other" },
};

const COLOR_THEMES = {
  teal:  { name:"أخضر مغربي", teal:"#0F5C52", gold:"#C9971C" },
  navy:  { name:"كحلي ذهبي",  teal:"#1B3B5F", gold:"#C9971C" },
  maroon:{ name:"عنابي",      teal:"#7A2A2A", gold:"#D7A94B" },
  purple:{ name:"بنفسجي",     teal:"#4B3B75", gold:"#C9971C" },
};

/* ---------------- Storage layer ---------------- */
const Store = {
  async get(key, fallback){
    try{
      const r = await window.storage.get(key, false);
      return r ? JSON.parse(r.value) : fallback;
    }catch(e){ return fallback; }
  },
  async set(key, value){
    try{
      await window.storage.set(key, JSON.stringify(value), false);
      return true;
    }catch(e){ return false; }
  }
};

/* ---------------- Global in-memory DB ---------------- */
let DB = {
  auth: null,               // {username, password}
  settings: { darkMode:false, capital:0, colorTheme:"teal" },
  people: [],                // [{id,name,phone,notes,createdAt}]
  transactions: [],          // [{id,personId,type,amount,note,date,dueDate,invoiceNumber}]
  invoiceCounter: 0,
  general_invoices: [],       // record of generated comprehensive invoices {number,date}
};

let STATE = {
  booted:false,
  loggedIn:false,
  tab:"dashboard",
  personId:null,
  peopleSearch:"",
  txFilter:"all",
  reportRange:"monthly",
};

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function fmt(n){
  n = Number(n)||0;
  return n.toLocaleString('ar-MA',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function todayISO(){ return new Date().toISOString(); }
function fmtDate(iso){
  if(!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString('ar-MA',{day:'2-digit',month:'2-digit',year:'numeric'}) + " - " +
         d.toLocaleTimeString('ar-MA',{hour:'2-digit',minute:'2-digit'});
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---------------- Boot ---------------- */
async function boot(){
  const [auth, settings, people, transactions, invoiceCounter, gInv] = await Promise.all([
    Store.get('auth', null),
    Store.get('settings', { darkMode:false, capital:0, colorTheme:"teal" }),
    Store.get('people', []),
    Store.get('transactions', []),
    Store.get('invoiceCounter', 0),
    Store.get('general_invoices', []),
  ]);
  DB.auth = auth;
  DB.settings = settings;
  DB.people = people;
  DB.transactions = transactions;
  DB.invoiceCounter = invoiceCounter;
  DB.general_invoices = gInv;
  applyTheme();
  STATE.booted = true;
  STATE.loggedIn = !!auth;
  render();
}

function applyTheme(){
  document.documentElement.setAttribute('data-theme', DB.settings.darkMode ? 'dark':'light');
  const c = COLOR_THEMES[DB.settings.colorTheme] || COLOR_THEMES.teal;
  document.documentElement.style.setProperty('--teal', c.teal);
  document.documentElement.style.setProperty('--teal-deep', c.teal);
  document.documentElement.style.setProperty('--gold', c.gold);
}

/* ---------------- Derived calculations ---------------- */
function personTxs(personId){
  return DB.transactions.filter(t=>t.personId===personId).sort((a,b)=> new Date(b.date)-new Date(a.date));
}
function personBalance(personId){
  let owedToMe=0, owedByMe=0;
  DB.transactions.filter(t=>t.personId===personId).forEach(t=>{
    const def = TX_TYPES[t.type];
    if(def.bucket==='owed_to_me') owedToMe += def.sign*t.amount;
    if(def.bucket==='owed_by_me') owedByMe += def.sign*t.amount;
  });
  return { owedToMe, owedByMe, net: owedToMe - owedByMe };
}
function globalTotals(){
  let owedToMe=0, owedByMe=0, expBiz=0, expFam=0, expOther=0, incomeOther=0;
  DB.transactions.forEach(t=>{
    const def = TX_TYPES[t.type]; if(!def) return;
    const v = def.sign*t.amount;
    if(def.bucket==='owed_to_me') owedToMe+=v;
    if(def.bucket==='owed_by_me') owedByMe+=v;
    if(def.bucket==='expense_business') expBiz+=v;
    if(def.bucket==='expense_family') expFam+=v;
    if(def.bucket==='expense_other') expOther+=v;
    if(def.bucket==='income_other') incomeOther+=v;
  });
  const totalExpenses = expBiz+expFam+expOther;
  const cashBalance = Number(DB.settings.capital||0) + owedByMe - owedToMe*0 /*capital not auto-linked to receivables*/
                       + incomeOther - totalExpenses - owedByMe*0;
  return { owedToMe, owedByMe, expBiz, expFam, expOther, incomeOther, totalExpenses,
           capital: Number(DB.settings.capital||0) };
}
function dueAlerts(){
  const now = Date.now();
  const alerts = [];
  DB.transactions.forEach(t=>{
    if(t.type==='debt_them' && t.dueDate){
      const bal = personBalance(t.personId);
      if(bal.net > 0 && new Date(t.dueDate).getTime() <= now){
        const p = DB.people.find(p=>p.id===t.personId);
        alerts.push({personId:t.personId, name:p?p.name:'—', dueDate:t.dueDate, amount:t.amount});
      }
    }
  });
  // dedupe by person, keep earliest due date
  const map = {};
  alerts.forEach(a=>{
    if(!map[a.personId] || new Date(a.dueDate) < new Date(map[a.personId].dueDate)) map[a.personId]=a;
  });
  return Object.values(map);
}

function bindAuthEvents(){
  document.querySelectorAll('[data-act="switchAuth"]').forEach(el=>{
    el.onclick = ()=>{ STATE.authMode = el.dataset.m; render(); };
  });
  const loginBtn = document.querySelector('[data-act="doLogin"]');
  if(loginBtn) loginBtn.onclick = async ()=>{
    const u = document.getElementById('authUser').value.trim();
    const p = document.getElementById('authPass').value;
    if(!DB.auth || DB.auth.username!==u || DB.auth.password!==p){
      toast("بيانات الدخول غير صحيحة"); return;
    }
    STATE.loggedIn = true; render();
  };
  const regBtn = document.querySelector('[data-act="doRegister"]');
  if(regBtn) regBtn.onclick = async ()=>{
    const u = document.getElementById('authUser').value.trim();
    const p = document.getElementById('authPass').value;
    const p2 = document.getElementById('authPass2').value;
    if(!u || !p){ toast("عمر جميع الحقول"); return; }
    if(p!==p2){ toast("كلمتا المرور غير متطابقتين"); return; }
    DB.auth = { username:u, password:p };
    await Store.set('auth', DB.auth);
    STATE.loggedIn = true; toast("تم إنشاء الحساب بنجاح"); render();
  };
}

/* ---------------- Reports ---------------- */
function rangeBuckets(range){
  const now = new Date();
  const buckets = [];
  if(range==='daily'){
    for(let i=6;i>=0;i--){ const d=new Date(now); d.setDate(d.getDate()-i);
      buckets.push({label:d.toLocaleDateString('ar-MA',{weekday:'short'}), start:startOfDay(d), end:endOfDay(d)}); }
  } else if(range==='weekly'){
    for(let i=5;i>=0;i--){ const d=new Date(now); d.setDate(d.getDate()-i*7);
      const s = startOfWeek(d), e = endOfWeek(d);
      buckets.push({label:'أ'+(6-i), start:s, end:e}); }
  } else if(range==='monthly'){
    for(let i=5;i>=0;i--){ const d=new Date(now.getFullYear(), now.getMonth()-i, 1);
      const s = new Date(d.getFullYear(),d.getMonth(),1);
      const e = new Date(d.getFullYear(),d.getMonth()+1,0,23,59,59);
      buckets.push({label:d.toLocaleDateString('ar-MA',{month:'short'}), start:s, end:e}); }
  } else { // yearly
    for(let i=4;i>=0;i--){ const y=now.getFullYear()-i;
      buckets.push({label:String(y), start:new Date(y,0,1), end:new Date(y,11,31,23,59,59)}); }
  }
  return buckets;
}
function startOfDay(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
function endOfDay(d){ const x=new Date(d); x.setHours(23,59,59,999); return x; }
function startOfWeek(d){ const x=new Date(d); const day=x.getDay(); x.setDate(x.getDate()-day); return startOfDay(x); }
function endOfWeek(d){ const x=startOfWeek(d); x.setDate(x.getDate()+6); return endOfDay(x); }

function renderReports(){
  const range = STATE.reportRange;
  const buckets = rangeBuckets(range);
  const data = buckets.map(b=>{
    let expense=0, income=0;
    DB.transactions.forEach(t=>{
      const dt = new Date(t.date);
      if(dt>=b.start && dt<=b.end){
        const def=TX_TYPES[t.type];
        if(['expense_business','expense_family','expense_other'].includes(def.bucket)) expense+=t.amount;
        if(def.bucket==='payment_from' || t.type==='payment_from') income+=t.amount;
      }
    });
    return {...b, expense, income};
  });
  const max = Math.max(1, ...data.map(d=>Math.max(d.expense,d.income)));
  const totalExp = data.reduce((s,d)=>s+d.expense,0);
  const totalInc = data.reduce((s,d)=>s+d.income,0);

  return `
  <div class="seg">
    ${['daily','weekly','monthly','yearly'].map(r=>`<button class="${range===r?'active':''}" data-act="setRange" data-r="${r}">${{daily:'يومي',weekly:'أسبوعي',monthly:'شهري',yearly:'سنوي'}[r]}</button>`).join('')}
  </div>

  <div class="grid2" style="margin-top:16px;">
    <div class="stat-card"><div class="bar" style="background:var(--maroon)"></div><div class="lbl">إجمالي المصاريف بالفترة</div><div class="val">${fmt(totalExp)} <small>د.م</small></div></div>
    <div class="stat-card"><div class="bar" style="background:var(--green)"></div><div class="lbl">إجمالي التحصيل بالفترة</div><div class="val">${fmt(totalInc)} <small>د.م</small></div></div>
  </div>

  <div class="section-title">مصاريف الفترة</div>
  <div class="card">
    <div class="report-bar-wrap">
      ${data.map(d=>`<div class="report-bar" style="height:${Math.max(4,(d.expense/max)*90)}px;background:var(--maroon-soft);">
        <div style="position:absolute;bottom:100%;right:0;left:0;text-align:center;font-size:9px;color:var(--maroon);margin-bottom:2px;">${d.expense?Math.round(d.expense):''}</div>
        <span>${d.label}</span></div>`).join('')}
    </div>
  </div>

  <div class="section-title">تحصيل الديون بالفترة</div>
  <div class="card">
    <div class="report-bar-wrap">
      ${data.map(d=>`<div class="report-bar" style="height:${Math.max(4,(d.income/max)*90)}px;background:var(--green-soft);">
        <div style="position:absolute;bottom:100%;right:0;left:0;text-align:center;font-size:9px;color:var(--green);margin-bottom:2px;">${d.income?Math.round(d.income):''}</div>
        <span>${d.label}</span></div>`).join('')}
    </div>
  </div>
  <div style="height:14px;"></div>
  `;
}

/* ---------------- Modals ---------------- */
function openModal(html){
  const back = document.createElement('div');
  back.className='modal-backdrop'; back.id='modalBackdrop';
  back.innerHTML = `<div class="modal">${'<div class="modal-handle"></div>'}${html}</div>`;
  back.onclick = (e)=>{ if(e.target===back) closeModal(); };
  document.body.appendChild(back);
}
function closeModal(){ const el=document.getElementById('modalBackdrop'); if(el) el.remove(); }

function modalAddMenu(){
  openModal(`
    <h3>ماذا تريد أن تضيف؟</h3>
    <button class="btn btn-primary" style="margin-bottom:10px;" data-act="openAddPerson">شخص جديد</button>
    <button class="btn btn-outline" data-act="openAddTxGeneral">عملية / مصروف جديد</button>
  `);
  bindModalCommon();
}

function modalAddPerson(){
  openModal(`
    <h3>إضافة شخص جديد</h3>
    <div class="field"><label>الاسم الكامل</label><input id="mpName" placeholder="اسم الشخص"></div>
    <div class="field"><label>رقم الهاتف (اختياري)</label><input id="mpPhone" placeholder="06XXXXXXXX"></div>
    <div class="field"><label>ملاحظات (اختياري)</label><textarea id="mpNotes" placeholder="تفاصيل إضافية"></textarea></div>
    <button class="btn btn-primary" data-act="savePerson">حفظ الشخص</button>
  `);
  bindModalCommon();
}

function modalAddTx(personId){
  const people = DB.people;
  return openModal(`
    <h3>عملية جديدة</h3>
    ${!personId ? `<div class="field"><label>الشخص (اختياري للمصاريف)</label>
      <select id="mtPerson"><option value="">— بدون شخص (مصروف عام) —</option>
      ${people.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></div>` :
      `<input type="hidden" id="mtPerson" value="${personId}">`}
    <div class="field"><label>نوع العملية</label>
      <select id="mtType">
        ${Object.entries(TX_TYPES).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('')}
      </select>
    </div>
    <div class="field"><label>المبلغ (د.م)</label><input id="mtAmount" type="number" placeholder="0.00"></div>
    <div class="field"><label>تاريخ الاستحقاق (اختياري، للديون)</label><input id="mtDue" type="date"></div>
    <div class="field"><label>ملاحظة (اختياري)</label><textarea id="mtNote" placeholder="تفاصيل العملية"></textarea></div>
    <button class="btn btn-primary" data-act="saveTx">حفظ العملية</button>
  `);
}

function bindModalCommon(){
  document.querySelectorAll('[data-act="openAddPerson"]').forEach(b=>b.onclick=()=>{ closeModal(); modalAddPerson(); });
  document.querySelectorAll('[data-act="openAddTxGeneral"]').forEach(b=>b.onclick=()=>{ closeModal(); modalAddTx(null); bindTxModalEvents(); });
  const saveP = document.querySelector('[data-act="savePerson"]');
  if(saveP) saveP.onclick = async ()=>{
    const name = document.getElementById('mpName').value.trim();
    if(!name){ toast('اكتب اسم الشخص'); return; }
    const p = { id:uid(), name, phone:document.getElementById('mpPhone').value.trim(), notes:document.getElementById('mpNotes').value.trim(), createdAt: todayISO() };
    DB.people.push(p);
    await Store.set('people', DB.people);
    closeModal(); toast('تمت إضافة الشخص'); render();
  };
}

function bindTxModalEvents(){
  const saveTx = document.querySelector('[data-act="saveTx"]');
  if(saveTx) saveTx.onclick = async ()=>{
    const personId = document.getElementById('mtPerson').value || null;
    const type = document.getElementById('mtType').value;
    const amount = parseFloat(document.getElementById('mtAmount').value);
    const due = document.getElementById('mtDue').value;
    const note = document.getElementById('mtNote').value.trim();
    if(!amount || amount<=0){ toast('اكتب مبلغًا صحيحًا'); return; }
    const tx = { id:uid(), personId, type, amount, note, date: todayISO(), dueDate: due||null, invoiceNumber:null };
    DB.transactions.push(tx);
    await Store.set('transactions', DB.transactions);
    closeModal(); toast('تمت إضافة العملية'); render();
  };
}

function modalCapitalEdit(){
  STATE.tab='settings'; render();
  setTimeout(()=>document.getElementById('capitalInput')?.focus(), 100);
}

/* ---------------- PDF Invoice Generation ---------------- */
async function nextInvoiceNumber(){
  DB.invoiceCounter = (DB.invoiceCounter||0)+1;
  await Store.set('invoiceCounter', DB.invoiceCounter);
  return 'INV-' + String(DB.invoiceCounter).padStart(4,'0');
}

function buildInvoiceHtml({title, number, date, rows, totals}){
  return `
  <div style="direction:rtl;font-family:'Tajawal',sans-serif;width:700px;padding:34px;color:#1E2A28;background:#fff;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #0F5C52;padding-bottom:16px;margin-bottom:20px;">
      <div>
        <div style="font-size:20px;font-weight:800;">${OWNER_NAME}</div>
        <div style="font-size:12px;color:#666;margin-top:4px;">${title}</div>
      </div>
      <div style="text-align:left;font-size:12px;">
        <div>رقم الفاتورة: <b>${number}</b></div>
        <div>التاريخ: <b>${fmtDate(date)}</b></div>
      </div>
    </div>
    <table style="width:100%;border-collapse:collapse;font-size:12.5px;">
      <thead><tr style="background:#F3E6C2;">
        <th style="padding:8px;text-align:right;border:1px solid #ddd;">التاريخ</th>
        <th style="padding:8px;text-align:right;border:1px solid #ddd;">النوع</th>
        ${rows[0]&&rows[0].person!==undefined?'<th style="padding:8px;text-align:right;border:1px solid #ddd;">الشخص</th>':''}
        <th style="padding:8px;text-align:right;border:1px solid #ddd;">ملاحظة</th>
        <th style="padding:8px;text-align:left;border:1px solid #ddd;">المبلغ (د.م)</th>
      </tr></thead>
      <tbody>
        ${rows.map(r=>`<tr>
          <td style="padding:7px;border:1px solid #eee;">${fmtDate(r.date)}</td>
          <td style="padding:7px;border:1px solid #eee;">${r.type}</td>
          ${r.person!==undefined?`<td style="padding:7px;border:1px solid #eee;">${r.person||'-'}</td>`:''}
          <td style="padding:7px;border:1px solid #eee;">${r.note||'-'}</td>
          <td style="padding:7px;border:1px solid #eee;text-align:left;">${fmt(r.amount)}</td>
        </tr>`).join('')}
      </tbody>
    </table>
    <div style="margin-top:20px;display:flex;justify-content:flex-end;">
      <table style="font-size:13px;">
        ${totals.map(t=>`<tr><td style="padding:5px 20px 5px 0;color:#666;">${t.label}</td><td style="padding:5px 0;font-weight:800;text-align:left;">${fmt(t.value)} د.م</td></tr>`).join('')}
      </table>
    </div>
    <div style="margin-top:30px;font-size:11px;color:#999;text-align:center;border-top:1px solid #eee;padding-top:14px;">
      تم إصدار هذه الفاتورة تلقائيًا عبر تطبيق محاسبة ${OWNER_NAME}
    </div>
  </div>`;
}

async function generatePdfFromHtml(html, filename){
  const holder = document.createElement('div');
  holder.style.position='fixed'; holder.style.left='-9999px'; holder.style.top='0';
  holder.innerHTML = html;
  document.body.appendChild(holder);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF('p','pt','a4');
  await new Promise(resolve=>{
    doc.html(holder.firstElementChild, {
      callback: function(doc){
        doc.save(filename);
        holder.remove();
        resolve();
      },
      x:20, y:20, width:555, windowWidth:700
    });
  });
}

async function personInvoicePdf(personId){
  const p = DB.people.find(p=>p.id===personId);
  if(!p) return;
  toast('جارٍ إنشاء الفاتورة...');
  const number = await nextInvoiceNumber();
  const txs = personTxs(personId);
  txs.forEach(t=>{ t.invoiceNumber = number; });
  await Store.set('transactions', DB.transactions);
  const bal = personBalance(personId);
  const rows = txs.map(t=>({ date:t.date, type:TX_TYPES[t.type].label, note:t.note, amount:t.amount }));
  const html = buildInvoiceHtml({
    title:`فاتورة خاصة بـ: ${p.name}${p.phone?' — '+p.phone:''}`,
    number, date: todayISO(), rows,
    totals:[
      {label:'إجمالي المستحق له', value:bal.owedToMe},
      {label:'إجمالي المستحق عليه', value:bal.owedByMe},
      {label:'الرصيد الصافي', value:bal.net},
    ]
  });
  await generatePdfFromHtml(html, `فاتورة-${p.name}-${number}.pdf`);
  toast('تم إنشاء الفاتورة');
}

async function generalInvoicePdf(){
  toast('جارٍ إنشاء الفاتورة الشاملة...');
  const number = await nextInvoiceNumber();
  const rows = [...DB.transactions].sort((a,b)=>new Date(a.date)-new Date(b.date)).map(t=>{
    const p = DB.people.find(p=>p.id===t.personId);
    return { date:t.date, type:TX_TYPES[t.type].label, person:p?p.name:'', note:t.note, amount:t.amount };
  });
  const t = globalTotals();
  const html = buildInvoiceHtml({
    title:'فاتورة شاملة لجميع العمليات',
    number, date: todayISO(), rows,
    totals:[
      {label:'إجمالي الديون لي', value:t.owedToMe},
      {label:'إجمالي الديون علي', value:t.owedByMe},
      {label:'إجمالي المصاريف', value:t.totalExpenses},
    ]
  });
  DB.general_invoices.push({number, date:todayISO()});
  await Store.set('general_invoices', DB.general_invoices);
  await generatePdfFromHtml(html, `فاتورة-شاملة-${number}.pdf`);
  toast('تم إنشاء الفاتورة الشاملة');
}

/* ---------------- Backup ---------------- */
function exportBackup(){
  const data = { auth:DB.auth, settings:DB.settings, people:DB.people, transactions:DB.transactions, invoiceCounter:DB.invoiceCounter, general_invoices:DB.general_invoices, exportedAt: todayISO() };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download = `backup-محاسبة-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  toast('تم تصدير النسخة الاحتياطية');
}
function importBackupFile(file){
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const data = JSON.parse(e.target.result);
      DB.auth = data.auth || DB.auth;
      DB.settings = data.settings || DB.settings;
      DB.people = data.people || [];
      DB.transactions = data.transactions || [];
      DB.invoiceCounter = data.invoiceCounter || 0;
      DB.general_invoices = data.general_invoices || [];
      await Promise.all([
        Store.set('auth', DB.auth), Store.set('settings', DB.settings), Store.set('people', DB.people),
        Store.set('transactions', DB.transactions), Store.set('invoiceCounter', DB.invoiceCounter),
        Store.set('general_invoices', DB.general_invoices),
      ]);
      applyTheme();
      toast('تم استيراد النسخة الاحتياطية');
      render();
    }catch(err){ toast('ملف غير صالح'); }
  };
  reader.readAsText(file);
}

/* ---------------- Global event binding ---------------- */
function bindGlobalEvents(){
  document.querySelectorAll('[data-act="tab"]').forEach(b=>b.onclick=()=>{ STATE.tab=b.dataset.tab; STATE.personId=null; render(); });
  document.querySelectorAll('[data-act="back"]').forEach(b=>b.onclick=()=>{ STATE.personId=null; render(); });
  document.querySelectorAll('[data-act="toggleDark"]').forEach(b=>b.onclick=async()=>{
    DB.settings.darkMode = !DB.settings.darkMode; await Store.set('settings', DB.settings); applyTheme(); render();
  });
  document.querySelectorAll('[data-act="openAddMenu"]').forEach(b=>b.onclick=()=>modalAddMenu());
  document.querySelectorAll('[data-act="openAddPerson"]').forEach(b=>b.onclick=()=>modalAddPerson());
  document.querySelectorAll('[data-act="openPerson"]').forEach(b=>b.onclick=()=>{ STATE.personId=b.dataset.id; render(); });
  document.querySelectorAll('[data-act="openAddTx"]').forEach(b=>b.onclick=()=>{ modalAddTx(b.dataset.pid); bindTxModalEvents(); });
  document.querySelectorAll('[data-act="deletePerson"]').forEach(b=>b.onclick=async()=>{
    if(!confirm('هل تريد حذف هذا الشخص وجميع عملياته؟')) return;
    const pid = b.dataset.pid;
    DB.people = DB.people.filter(p=>p.id!==pid);
    DB.transactions = DB.transactions.filter(t=>t.personId!==pid);
    await Promise.all([Store.set('people',DB.people), Store.set('transactions',DB.transactions)]);
    STATE.personId=null; toast('تم الحذف'); render();
  });
  document.querySelectorAll('[data-act="personInvoice"]').forEach(b=>b.onclick=()=>personInvoicePdf(b.dataset.pid));
  document.querySelectorAll('[data-act="generalInvoice"]').forEach(b=>b.onclick=()=>generalInvoicePdf());
  document.querySelectorAll('[data-act="setRange"]').forEach(b=>b.onclick=()=>{ STATE.reportRange=b.dataset.r; render(); });
  document.querySelectorAll('[data-act="setColor"]').forEach(b=>b.onclick=async()=>{
    DB.settings.colorTheme=b.dataset.c; await Store.set('settings',DB.settings); applyTheme(); render();
  });
  document.querySelectorAll('[data-act="saveCapital"]').forEach(b=>b.onclick=async()=>{
    DB.settings.capital = parseFloat(document.getElementById('capitalInput').value)||0;
    await Store.set('settings', DB.settings); toast('تم حفظ رأس المال'); render();
  });
  document.querySelectorAll('[data-act="editCapital"]').forEach(b=>b.onclick=()=>modalCapitalEdit());
  document.querySelectorAll('[data-act="exportBackup"]').forEach(b=>b.onclick=()=>exportBackup());
  document.querySelectorAll('[data-act="logout"]').forEach(b=>b.onclick=()=>{ STATE.loggedIn=false; STATE.tab='dashboard'; render(); });
  const importInput = document.getElementById('importFile');
  if(importInput) importInput.onchange = (e)=>{ if(e.target.files[0]) importBackupFile(e.target.files[0]); };

  const peopleSearchInput = document.getElementById('peopleSearchInput');
  if(peopleSearchInput){
    peopleSearchInput.oninput = ()=>{ STATE.peopleSearch = peopleSearchInput.value; render(); setTimeout(()=>{ const el=document.getElementById('peopleSearchInput'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length);} },0); };
  }
}

/* ---------------- Init ---------------- */
document.addEventListener('DOMContentLoaded', ()=>{
  boot();
  setTimeout(()=>{ const s=document.getElementById('splashScreen'); if(s) s.style.display='none'; }, 3200);
});

</script>
